name: 버그
description: 재현 가능한 문제를 알린다. 리플레이 파일이 곧 버그 리포트다.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나
      description: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 시드, 스테이지, 턴 번호. 리플레이 JSON 을 첨부하면 가장 좋다
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱 버전
      placeholder: 0.2.0+1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기·Android 버전
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [sim, ai, data, app, render, input, shipyard, meta, 기타]
