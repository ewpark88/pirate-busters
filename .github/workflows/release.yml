# 릴리스 빌드 (docs/RELEASE.md). 태그 vX.Y.Z+B 를 push 하면 verify → 서명된 AAB → GitHub Release 초안.
# Play Console 업로드는 사람이 한다(비공개 테스트 트랙). 서명 비밀값이 없으면 debug 서명으로 빌드하고 경고한다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Tag ↔ pubspec ↔ CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: dart run tool/release.dart check "${GITHUB_REF_NAME}"

      - name: Verify
        run: bash tool/verify.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 가 없어 debug 서명으로 빌드한다. 스토어에 올릴 수 없다."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Release notes
        run: dart run tool/release.dart notes > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/app/outputs/bundle/release/app-release.aab

      - name: Clean signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/upload.jks"
