# PR·main push 품질 게이트. 로컬 tool/verify.sh 와 같은 단계를 실행한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify (format / analyze / architecture · determinism / test)
        run: bash tool/verify.sh

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
