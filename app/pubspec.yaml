name: pirate_busters
description: "Pirate Busters — 내가 지은 해적선으로 겨루는 1:1 해상 포격전"
publish_to: 'none'
resolution: workspace

# 버전 규칙: MVP 기간은 0.x (CLAUDE.md 「브랜치·커밋·버전」).
version: 0.2.0+1

environment:
  sdk: ^3.12.0

# 의존성은 필요한 마일스톤에서만 추가한다. 버전은 mozzi 와 맞춘다 (ADR-029).
dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^4.1.7
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  intl: any
  pb_ai:
    path: ../packages/pb_ai
  pb_data:
    path: ../packages/pb_data
  pb_sim:
    path: ../packages/pb_sim

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  # 바다 측면 굴절 (설계서 §10.2, ADR-030). 저사양 모드에서 끈다.
  shaders:
    - shaders/sea_refraction.frag
  # 한글·라틴을 모두 가진 OFL 글꼴 (설계서 §14.4): 제목·숫자 / 본문 / 둥근 강조.
  # 라이선스: assets/fonts/OFL.txt(Jua), OFL-BlackHanSans.txt, OFL-IBMPlexSansKR.txt
  fonts:
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
  # 아트 에셋 v0.22 (docs/ASSETS.md). 폴더를 바꾸면 dart run tool/import_assets.dart --check
